[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-ai-trading"
version = "0.0.1"
description = "FX prediction and short-term trading system (MVP: paper mode only)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
authors = [{ name = "くりす" }]

# Runtime dependencies intentionally empty for Cycle 1.
# Added in later M1 cycles per docs/iteration1_implementation_plan.md 6.1.
# Constraint: no DB / Alembic / Strategy / Interface implementation in Cycle 1.
dependencies = [
    "alembic>=1.13,<2.0",
    "click>=8.1,<9.0",
    "oandapyV20>=0.7,<1.0",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0",
    "lightgbm>=4.3,<5.0",
    "pyyaml>=6.0,<7.0",
    "scikit-learn>=1.4,<2.0",
    "pyarrow>=15.0,<20.0",
    "sqlalchemy>=2.0,<3.0",
    "plotly>=5.0,<7.0",
    "streamlit>=1.35,<2.0",
]

[project.optional-dependencies]
dev = [
    # Ruff is pinned exactly, not ranged: CI installs via `pip install -e ".[dev]"`,
    # so a floating spec resolved to a newer Ruff on every run. Ruff 0.16.0 began
    # formatting Python code blocks inside Markdown, which failed `ruff format
    # --check .` on 17 pre-existing docs. 0.15.11 is the version already recorded
    # in uv.lock and .pre-commit-config.yaml, so all install paths now agree.
    "ruff==0.15.11",
    "pytest>=8.0,<9.0",
    # The B-1 regression proof (pandas.Timestamp nanoseconds defeating the
    # minute-alignment guard) needs pandas. It previously arrived only
    # transitively, so the whole blocker-regression module could skip silently.
    "pandas>=2.0,<4.0",
]

[tool.setuptools.packages.find]
# src layout: auto-discover packages under src/ (e.g. fx_ai_trading and future subpackages).
# setuptools >= 68 supports this natively; no package-dir needed.
where = ["src"]

# --- Ruff (lint + format integrated) ---
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist", "migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear
    "UP",   # pyupgrade (Python 3.12 syntax suggestions)
    "SIM",  # flake8-simplify
    "N",    # pep8-naming (aligns with docs/development_rules.md 4.1)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --ignore=tests/migration/test_roundtrip.py"
markers = [
    "destructive: test drops/truncates real DB tables — run explicitly with -m destructive",
    # Resource gates. Presence of the resource is not authorization to use it:
    # each marker below is skipped by tests/conftest.py unless the matching
    # opt-in in tests/optin.py is granted. See docs/development_rules.md §2.11.
    "db: needs a live database — set RUN_DB_INTEGRATION_TESTS=1 and export DATABASE_URL",
    "research_data: reads local research data — set RUN_RESEARCH_DATA_TESTS=1",
    "external: reaches a broker, object storage or the network — set RUN_EXTERNAL_TESTS=1",
]
